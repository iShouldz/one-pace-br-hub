name: Update Scrape Cache

on:
  workflow_dispatch:
  schedule:
    # UTC: Fridays at 14:17
    - cron: "17 14 * * 5"

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BRANCH_BYPASS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate scrape cache JSON
        run: node scripts/update-scrape-cache.mjs

      - name: Commit changes
        run: |
          git config user.name "cache-bot"
          git config user.email "cache-bot@users.noreply.github.com"
          if git diff --quiet -- public/data/scrape-cache.json; then
            echo "No changes to commit"
            exit 0
          fi
          git add public/data/scrape-cache.json
          git commit -m "chore: update scrape cache"
          git push origin HEAD:${GITHUB_REF_NAME}
